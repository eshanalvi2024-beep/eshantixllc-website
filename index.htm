<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESHAN TIX LLC | Retail & Wholesale</title>
  <link rel="icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Body ===== */
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f0fdf4;   /* Grove-style light green */
      color: #0f172a;
    }

    /* ===== Header ===== */
    header.site-header {
      display: flex;
      justify-content: space-between; /* menu left, logo right */
      align-items: center;
      padding: 18px 60px;
      background: #065f46; /* dark green */
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    header.site-header .menu {
      display: flex;
      gap: 25px;
    }

    header.site-header .menu a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }

    header.site-header .logo-container .logo {
      height: 60px;
      display: block;
    }

    /* ===== Hero Section ===== */
    .hero {
      padding: 80px 60px;
      background: linear-gradient(rgba(2,6,23,.3), rgba(2,6,23,.3)), #047857; /* medium green */
      color: #fff;
      text-align: center;
    }

    .hero h1 {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .hero p {
      max-width: 700px;
      margin: 0 auto;
      color: #e5e7eb;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      height: 200px;
      object-fit: cover;
    }

    /* ===== Sections ===== */
    .section {
      padding: 80px 60px;
      background: #fff;
    }

    .section.gray {
      background: #f1f5f9;
    }

    .section h2 {
      font-size: 36px;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
      gap: 25px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 25px;
    }

    /* ===== Footer ===== */
    .footer {
      background: #020617;
      color: #cbd5e1;
      padding: 60px;
      text-align: center;
    }

    .footer h3 {
      color: #fff;
      margin-bottom: 15px;
    }

    .footer a {
      color: #cbd5e1;
      text-decoration: none;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      header.site-header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }

      header.site-header .menu {
        flex-wrap: wrap;
      }

      .hero {
        padding: 60px 20px;
      }

      .section {
        padding: 60px 20px;
      }
    }
  </style>
</head>
<body class="homepage">

<!-- ===== Header ===== -->

  <nav class="menu">

    <a href="#products">Products</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
    <a href="#policies">Policies</a>
  </nav>
  <div class="logo-container">

  </div>
</header>
